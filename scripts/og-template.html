<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MusicPod social image · 1200 × 630</title>
  <!-- Serve a temporary copy from public/ and capture at 1200 × 630. -->
  <style>
    * { box-sizing: border-box; }
    body { display: grid; grid-template-columns: 56% 44%; width: 1200px; height: 630px; margin: 0; overflow: hidden; background: #fff; color: #1d1d1f; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
    main { display: flex; align-items: flex-start; flex-direction: column; padding: 65px 0 48px 64px; }
    .brand { display: flex; align-items: center; gap: 14px; font-size: 27px; font-weight: 600; letter-spacing: -.8px; }
    .brand img { width: 46px; height: 46px; }
    h1 { margin: 68px 0 24px; font-size: 70px; font-weight: 600; letter-spacing: -3.5px; line-height: 1.05; }
    h1 span { display: block; }
    p { margin: 0; color: #6e6e73; font-size: 21px; line-height: 1.5; }
    small { margin-top: auto; color: #6e6e73; font-size: 17px; }
    .photo { width: 100%; height: 630px; object-fit: cover; object-position: 50% 50%; }
  </style>
  <main>
    <div class="brand"><img src="/app-icon.png" alt="">MusicPod</div>
    <h1><span>Your music</span><span>In your hands</span></h1>
    <p>The classic click wheel, on iPhone.</p>
    <small>musicpod.app</small>
  </main>
  <img class="photo" src="/product/studio/hands.webp" alt="MusicPod campaign visual">
</html>
